name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: Run live provider downloads
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * 1"

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: android-setup profiles validate
      - run: pytest -m 'not live' --cov=android_setup --cov-branch tests

  live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y aapt apksigner
      - run: python -m pip install -e '.[dev]'
      - run: ANDROID_SETUP_LIVE=1 pytest -m live -v tests/test_live.py
